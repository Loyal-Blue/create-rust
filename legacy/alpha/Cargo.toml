[workspace]
resolver = "3"
members = ["kinetics", "simulation", "runtime", "server", "vendor/horizon-mod-sdk"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
